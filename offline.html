<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Sin conexión · CRM Prospector</title>
<meta name="theme-color" content="#0a2d52"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    background: #0a2d52; color: #eaf1f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  .mark {
    width: 64px; height: 64px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.10); font-size: 30px; font-weight: 800; letter-spacing: .5px;
  }
  h1 { font-size: 20px; margin: 4px 0 0; font-weight: 700; }
  p { margin: 0; max-width: 340px; font-size: 15px; line-height: 1.5; color: rgba(234,241,248,.82); }
  button {
    margin-top: 6px; padding: 12px 22px; border: 0; border-radius: 10px;
    background: #eaf1f8; color: #0a2d52; font-size: 15px; font-weight: 600; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  button:active { opacity: .85; }
  .hint { font-size: 12.5px; color: rgba(234,241,248,.55); }
</style>
</head>
<body>
  <div class="mark">F</div>
  <h1>Sin conexión</h1>
  <p>No se pudo cargar el CRM porque tu dispositivo está sin conexión. Vuelve a intentarlo cuando recuperes cobertura o Wi-Fi.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
  <div class="hint">CRM Prospector · GPF</div>
  <script>
    // Reintenta solo cuando el navegador detecta que ha vuelto la conexión.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
