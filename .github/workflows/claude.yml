name: Claude Code — GPF CRM

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  # Antes había aquí un disparador `push` para el job `claude-review`, que abría
  # una issue con una revisión automática de cada commit a main. Retirado el
  # 5-oct-2026 (fase 1 de MIGRACION-SUSCRIPCION.md): gastaba API en cada push y la
  # revisión se hace mejor desde la pestaña Code, con el repo delante.

jobs:
  # ── Responde a @claude en issues y PRs ──────────────────────────────────────
  claude-mention:
    # H1: solo usuarios de confianza del repo (OWNER/MEMBER/COLLABORATOR) pueden
    # disparar Claude. Sin este gating, cualquier usuario externo podía invocarlo
    # con permisos de escritura comentando "@claude".
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - name: Claude Code
        uses: anthropics/claude-code-action@70a6e5256e9e2366a1ed5c041904a982ba3a328f # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-4-6
            --system-prompt "Eres el asistente de desarrollo del CRM de Ferroplast/GPF (Grupo GPF). Es un CRM comercial en HTML/JS puro sin framework. Backend: Supabase (fuente de verdad del rediseño, batch y cruce PLACSP) desde la migración de 2026-06; Google Apps Script actúa de proxy para la Claude API y Google Calendar. Archivo principal: index.html (loader del rediseño en redesign/); chat.html ya no es una pantalla, solo redirige al asistente del rediseño. Cuando revises código, céntrate en: bugs en el flujo de planificador, lógica de filtros de estudios por zona/provincia, capa de datos Supabase y llamadas GAS. Responde siempre en español."
