# ============================================================
# CRM GPF — Batch Qualify Scheduler (GAS/Firestore)
# Fase E del Método Unificado v1.1 (§15.3)
#
# ESTADO: DESACTIVADO (2026-05-27)
#   Sustituido por batch-qualify-node.yml que escribe en Supabase
#   (backend activo desde migración de mayo 2026).
#   El endpoint GAS devuelve {} vacío porque Firestore ya no tiene datos.
#   Mantener solo para referencia histórica / rollback de emergencia.
# ============================================================

name: Batch Qualify Studios

on:
  # schedule desactivado — usar batch-qualify-node.yml en su lugar
  workflow_dispatch:          # Solo manual si se necesita por emergencia
    inputs:
      filtro:
        description: 'Filtro de estudios (sin_cuadrante | todos | ARQ | ING | OCV | AAPP | CCRR | CICA)'
        required: false
        default: 'sin_cuadrante'
      limite:
        description: 'Número máximo de estudios a procesar (1-1585)'
        required: false
        default: '200'

jobs:
  batch-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify secrets present
        run: |
          if [ -z "${{ secrets.BATCH_ENDPOINT }}" ]; then
            echo "❌ BATCH_ENDPOINT secret no configurado. Ver SETUP_BATCH_QUALIFY.md"
            exit 1
          fi
          if [ -z "${{ secrets.BATCH_API_KEY }}" ]; then
            echo "❌ BATCH_API_KEY secret no configurado. Ver SETUP_BATCH_QUALIFY.md"
            exit 1
          fi
          echo "✅ Secrets configurados"

      - name: Trigger batch qualification
        id: trigger
        env:
          FILTRO: ${{ inputs.filtro || 'sin_cuadrante' }}
          LIMITE: ${{ inputs.limite || '200' }}
        run: |
          echo "======================================"
          echo "CRM GPF — Batch Qualify"
          echo "======================================"
          echo "Filtro:    $FILTRO"
          echo "Límite:    $LIMITE"
          echo "Endpoint:  ${BATCH_ENDPOINT:0:60}..."
          echo "Ejecutado: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo ""

          # NOTA: El doPost del CRM lee e.parameter (no body JSON), así que
          # enviamos form-urlencoded. Además los GAS Web Apps devuelven HTTP 302
          # tras el POST y curl no mantiene el body en el redirect, por lo que
          # hacemos el manejo manual: POST → capturar Location → GET.

          POST_RAW=$(curl --silent --show-error --max-time 60 -i \
            -X POST "${{ secrets.BATCH_ENDPOINT }}" \
            --data-urlencode "action=batchQualify" \
            --data-urlencode "apiKey=${{ secrets.BATCH_API_KEY }}" \
            --data-urlencode "filtro=$FILTRO" \
            --data-urlencode "limite=$LIMITE")

          LOCATION=$(echo "$POST_RAW" | grep -i '^location:' | head -1 | tr -d '\r' | sed 's/^[Ll]ocation: *//')

          if [ -z "$LOCATION" ]; then
            echo "❌ El POST inicial no devolvió Location header (estado distinto a 302)"
            echo "$POST_RAW" | head -30
            exit 1
          fi

          RESP=$(curl --silent --show-error --max-time 300 -X GET "$LOCATION")
          STATUS=$?

          echo "Respuesta del endpoint:"
          echo "$RESP" | jq . 2>/dev/null || echo "$RESP"
          echo ""

          if [ $STATUS -ne 0 ]; then
            echo "❌ Llamada al endpoint falló (exit=$STATUS)"
            exit $STATUS
          fi

          # Extraer métricas con jq (no falla si las claves no existen)
          PROCESSED=$(echo "$RESP" | jq -r '.processed // 0')
          UPDATED=$(echo "$RESP" | jq -r '.updated // 0')
          PUENTE=$(echo "$RESP" | jq -r '.nuevosCandidatosPuente // 0')
          ERR_COUNT=$(echo "$RESP" | jq -r '.errors | length // 0')

          echo "======================================"
          echo "Resumen"
          echo "======================================"
          echo "Procesados:                $PROCESSED"
          echo "Actualizados:              $UPDATED"
          echo "Nuevos candidatos puente:  $PUENTE"
          echo "Errores:                   $ERR_COUNT"
          echo "======================================"

          if [ "$ERR_COUNT" != "0" ] && [ "$ERR_COUNT" != "null" ]; then
            echo "⚠️  Hubo errores parciales. Ver detalle arriba."
          fi
