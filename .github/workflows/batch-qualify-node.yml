# ============================================================
# CRM GPF — Batch Qualify Node (reemplazo del GAS legacy)
#
# Port de gas-batch-qualify.gs::handleBatchQualify a Node.js puro corriendo
# en GH Actions. Razón: las nuevas Secret API keys de Supabase (sb_secret_*)
# no son válidas desde GAS UrlFetchApp (Supabase las rechaza como "browser"),
# así que necesitamos un "protected environment" real.
#
# Llamado cada noche a las 02:30 UTC. Recalcula scoring v2 y escribe en Supabase
# (incluido el checkpoint en meta_kv). Firestore retirado (2026-06).
#
# Secrets de repo necesarios:
#   - SUPABASE_URL              → https://<ref>.supabase.co
#   - SUPABASE_SERVICE_ROLE_KEY → service role (ignora RLS)
#
# ESTADO: único batch nocturno. El cron viejo GAS/Firestore (batch-qualify.yml)
# se retiró en 2026-06; este workflow lo reemplaza por completo.
# ============================================================

name: Batch Qualify Studios (Node)

on:
  schedule:
    # Diario 22:00 UTC — recálculo COMPLETO (v2.1): re-evalúa TODA la cartera
    # (nuevos + enriquecidos). Es idempotente y barato (solo escribe los que
    # cambian de cuadrante). Antes del backup semanal de los domingos (04:00).
    #
    # Por qué 22:00 y no la hora en que quiero el resultado: GitHub NO respeta la
    # hora del cron, lo encola. Medido sobre 14 días (21-sep → 4-oct-2026) con el
    # cron a las 02:30 UTC, arrancaba de hecho entre las 07:44 y las 09:16 UTC:
    # un retraso de 5h14 a 6h46. Con el cron a las 22:00 UTC del día anterior,
    # ese mismo retraso lo deja aterrizando entre las 03:14 y las 04:46 UTC,
    # o sea 05:14-06:46 en España (verano) y una hora antes en invierno: ya
    # recalificado cuando Manolo se sienta. Complementa, no sustituye, al
    # disparo local al arrancar el Mac (run-qualify-catchup.sh).
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      filtro:
        description: 'Filtro de estudios'
        type: choice
        required: false
        default: 'todos'
        options:
          - todos
          - sin_cuadrante
          - ARQ
          - ING
          - OCV
          - AAPP
          - CCRR
          - CICA
      limite:
        description: 'Número máximo de estudios a procesar'
        required: false
        default: '2000'
      dry_run:
        description: 'DRY-RUN: recalcula y reporta el impacto SIN escribir'
        type: choice
        required: false
        default: 'no'
        options:
          - 'no'
          - 'yes'

permissions:
  contents: read

jobs:
  batch-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Verify secrets present
        run: |
          missing=()
          [ -z "${{ secrets.SUPABASE_URL }}" ]              && missing+=(SUPABASE_URL)
          [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] && missing+=(SUPABASE_SERVICE_ROLE_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Faltan secrets: ${missing[*]}"
            exit 1
          fi
          echo "✅ Todos los secrets presentes"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Run batch-qualify (Node)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # El cron diario hace recálculo completo (todos). Manual puede sobreescribir.
          FILTRO: ${{ inputs.filtro || 'todos' }}
          LIMITE: ${{ inputs.limite || '2000' }}
          DRY_RUN: ${{ inputs.dry_run == 'yes' && '1' || '' }}
        run: |
          echo "======================================"
          echo "Batch Qualify Node"
          echo "======================================"
          echo "Filtro:  $FILTRO"
          echo "Límite:  $LIMITE"
          echo "Ejecutado: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo ""
          node scripts/batch-qualify/index.mjs
