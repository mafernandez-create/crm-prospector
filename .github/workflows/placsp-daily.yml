# ============================================================
# CRM GPF — PLACSP Daily Crosscheck (Bloque 10 / §19.3)
#
# Descarga incremental del feed ATOM de la Plataforma de Contratación
# del Sector Público, filtra por CPV relevantes (ingeniería, obra
# hidráulica, conducciones) y POSTea las adjudicaciones a un endpoint
# nuevo del GAS para cruzar con la cartera del CRM.
#
# Programado: 03:00 UTC todos los días (1h después del batch-qualify).
# ============================================================

name: PLACSP Daily Crosscheck

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC diario
  workflow_dispatch:
    inputs:
      desde:
        description: 'Fecha desde (YYYY-MM-DD) para pasada histórica'
        required: false
        default: ''
      hasta:
        description: 'Fecha hasta (YYYY-MM-DD) para pasada histórica'
        required: false
        default: ''
      limite_adjudicaciones:
        description: 'Máximo de adjudicaciones a procesar por pasada'
        required: false
        default: '500'

# El chequeo de frescura abre/cierra un Issue si PLACSP deja de ingerir.
permissions:
  contents: read
  issues:   write

jobs:
  placsp-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Verify secrets present
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "❌ SUPABASE_URL secret no configurado"; exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "❌ SUPABASE_SERVICE_ROLE_KEY secret no configurado"; exit 1
          fi
          echo "✅ Secrets configurados"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Run PLACSP fetch + filter + cross-check (Supabase)
        env:
          # Supabase es la única escritura del cross-check (Firestore/GAS retirado
          # 2026-06). El script falla si estos secrets no están configurados.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          LIMITE: ${{ inputs.limite_adjudicaciones || '500' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "❌ SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY no configurados — el cross-check fallará."
          else
            echo "✅ Cross-check contra Supabase (única fuente de verdad)."
          fi
          node scripts/placsp-fetch.js

      # Vigila que la ingesta no se "muera en silencio": si el feed lleva días
      # inalcanzable (soft-skip → verde), abre un Issue; si se recupera, lo cierra.
      # always() para que corra aunque el paso anterior fallara.
      - name: PLACSP freshness check (alerta si lleva días sin ingerir)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_DAYS: '4'
        run: node scripts/placsp-freshness.js
