# ============================================================
# CRM GPF — Tests Daily
#
# Ejecuta la batería completa de tests del CRM (scripts/tests/run-all.js)
# todos los días a las 05:00 UTC. Si alguno falla, crea automáticamente un
# Issue de GitHub con el output capturado.
#
# Se puede lanzar manualmente desde la UI (workflow_dispatch).
# ============================================================

name: Tests Daily

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC todos los días (07:00 España verano / 06:00 invierno)
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite a ejecutar (--all | --unit | --integration | --e2e | --smoke)'
        required: false
        default: '--all'

permissions:
  contents: read
  issues:   write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Run test battery
        id: tests
        env:
          GH_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          CRM_URL:        ${{ vars.CRM_URL || 'https://mafernandez-create.github.io/crm-prospector/' }}
          TESTS_REPO:     ${{ github.repository }}
          SUITE:          ${{ inputs.suite || '--all' }}
        run: |
          set +e
          node scripts/tests/run-all.js $SUITE | tee tests-output.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open issue on failure
        if: steps.tests.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          {
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '<details><summary>Output completo</summary>'
            echo
            echo '```'
            tail -c 60000 tests-output.log
            echo '```'
            echo
            echo '</details>'
          } > issue-body.md
          # Asegura que la etiqueta existe (idempotente). Antes, si la etiqueta
          # no existía, `gh issue create` fallaba ENTERA y el aviso no se creaba
          # nunca → la batería se pudría en rojo sin notificar a nadie.
          gh label create "tests-failing" --repo "${{ github.repository }}" \
            --color B60205 --description "La batería de tests diaria falló" --force 2>/dev/null || true

          # Evita acumular un Issue nuevo cada día: si ya hay uno abierto con la
          # etiqueta, se comenta en él; si no, se crea.
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --label "tests-failing" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body-file issue-body.md || true
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "🔴 Batería de tests falló en $DATE" \
              --body-file issue-body.md \
              --label "tests-failing" || true
          fi

      # Auto-recuperación: si la batería vuelve a verde, cierra el Issue abierto
      # con la etiqueta (antes se quedaba colgado en rojo para siempre porque el
      # workflow solo abría/comentaba al fallar, nunca cerraba al recuperarse).
      - name: Close stale failure issue on success
        if: steps.tests.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --label "tests-failing" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "✅ La batería volvió a verde en el run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Cerrando automáticamente." || true
            gh issue close "$EXISTING" --repo "${{ github.repository }}" --reason completed || true
          fi

      - name: Fail step if tests failed
        if: steps.tests.outputs.status != '0'
        run: |
          echo "❌ Tests fallaron — exit code ${{ steps.tests.outputs.status }}"
          exit 1
